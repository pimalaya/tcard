[package]
name = "tcard"
description = "Edit and merge vCards as ergonomic TOML"
version = "0.2.0"
authors = ["Clément DOUIN (soywod) <clement.douin@posteo.net>"]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "text-processing"]
keywords = ["vcard", "contact", "toml", "carddav", "editor"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/tcard/latest/tcard"
repository = "https://github.com/pimalaya/tcard"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:pimalaya-cli", "dep:schemars", "dep:serde", "dep:simd-cpu", "dep:uuid"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "tcard"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "tcard"
path = "src/lib.rs"

[build-dependencies]
pimalaya-cli = { version = "0.7.0", default-features = false, features = ["build"], optional = true }

[[test]]
name = "output"
path = "tests/output.rs"
required-features = ["cli"]

[dev-dependencies]
proptest = "1"
serde_json = { version = "1", default-features = false, features = ["std"] }
tempfile = { version = "3", default-features = false }

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"], optional = true }
base64-codec = { version = "0.1", default-features = false, features = ["alloc"] }
clap = { version = "4.4", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"], optional = true }
log = { version = "0.4", default-features = false }
pimalaya-cli = { version = "0.7.0", default-features = false, features = ["prompt", "terminal"], optional = true }
schemars = { version = "1", default-features = false, features = ["derive"], optional = true }
serde = { version = "1", default-features = false, features = ["derive"], optional = true }
sha2 = { version = "0.11", default-features = false }
simd-cpu = { version = "0.1", default-features = false, features = ["std"], optional = true }
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
uuid = { version = "1", default-features = false, features = ["std", "v4"], optional = true }
vcard-rs = { version = "0.6.1", default-features = false, features = ["parser"] }
